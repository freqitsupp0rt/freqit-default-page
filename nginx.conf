# Default "nothing here" page for unknown hosts / the bare public IP.
# Every path returns HTTP 404 with the animated page; only /assets/* is served normally.
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    error_page 404 /index.html;

    location = /index.html {
        internal;
    }

    location / {
        return 404;
    }
}
